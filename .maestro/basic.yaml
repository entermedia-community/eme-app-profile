appId: world.eme.main
---
- launchApp

# Find a server in Search (Servers filter); tapping it joins (if needed) and opens its chat
- tapOn:
    id: "chats_open_search"
- tapOn:
    id: "search_type_servers"

- extendedWaitUntil:
    visible:
      id: "search_results"
- tapOn:
    id: "search_result_0"

- extendedWaitUntil:
    visible:
      id: "server_chat_input"
- tapOn:
    id: "server_chat_input"
- inputText: "Hello!"
- tapOn:
    id: "server_chat_send"
